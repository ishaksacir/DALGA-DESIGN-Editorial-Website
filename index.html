<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DALGA DESIGN — odjeća iz Bihaća s historijskim motivima našeg kraja. Svaki model nastaje u jednom uzorku, a po vašoj mjeri pravimo ga ponovo." />
    <title>DALGA DESIGN — Odjeća iz Bihaća, svaki model u jednom uzorku</title>
    <!-- Filled figure, not the outlined nav logo: its thin line disappears at tab size. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fonts are linked here rather than @imported from CSS, so they start downloading straight away. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400&display=swap"
    />
    <!-- Home hero wordmark face; the page is rendered by JS, so without this it is found late. -->
    <link
      rel="preload"
      href="/fonts/SangBleuEmpireTrial-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
