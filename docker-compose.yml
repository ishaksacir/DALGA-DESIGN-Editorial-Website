# Local Postgres for development: `npm run db:up`. Production uses a hosted database via DATABASE_URL.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dalga
      POSTGRES_PASSWORD: dalga
      POSTGRES_DB: dalga
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dalga']
      interval: 2s
      retries: 15

volumes:
  pgdata:
